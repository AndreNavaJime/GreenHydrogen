name: Apply dependency security fix

on:
  push:
    branches: ["security-audit"]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[security-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade Next.js to patched major
        run: npm install next@16.4.1 react@latest react-dom@latest
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Production build
        run: npm run build
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Upgrade web dependencies to patched versions [security-fix]"
            git push origin HEAD:security-audit
          fi
